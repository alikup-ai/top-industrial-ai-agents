# Niches with no credible entry. Re-checked 2026-11-07.
gaps:
  - category: guardrails
    description: "Process-semantics-aware safety envelope. What exists governs the agent; governing the physics needs a different kind of policy."
    status: partially-addressed
    addressed_by: ["alikup-ai/otgate"]
    note: >-
      CORRECTED in v0.3.1. v0.3 claimed nothing open understood the process.
      Wrong: otgate did, and existed when v0.3 was written. Still missing, and
      these are the real open parts: (1) field validation — one alpha project
      with zero stars and no deployment is not a solved category; (2) cross-tag
      constraints — envelopes are per tag everywhere, otgate included, so an
      agent spreading its effect across several tags is caught by nothing;
      (3) mode-dependent envelopes — no open project expresses "this range
      applies only in these process modes"; (4) trend awareness — the live value
      says where the process is, not how it got there; (5) a vendor-neutral
      vocabulary — text guardrails have Colang/OPA/Cedar, process envelopes have
      one project's YAML dialect, and nobody has mapped ISA-88 modes or ISA-18.2
      alarm states onto agent policy. Still the clearest open niche in the
      field — not because it is empty, but because what exists is one unproven
      implementation and four of its five hard parts are untouched.
  - category: benchmarks
    description: "Closed-loop process control benchmark — agent as supervisor of a running dynamic process, scored on safety-envelope violations, intervention count and diagnostic quality under alarm floods."
    status: open
  - category: simulators
    description: "Batch-process simulators (concrete, hydroponics, food) with fault models and realistic alarm behaviour."
    status: open
    note: "Re-searched across batch, fermentation, bioreactor and wastewater keywords for v0.3. Open results are student projects without fault models."
  - category: advisors
    description: "Open-source LLM operator advisor reference implementation."
    status: open
  - category: computer-vision
    description: "Agentic (not classifier-only) VLMs for industrial CV — planning inspection routes, escalating findings, deciding what to re-inspect."
    status: open
    note: "Re-searched for v0.3. Vendor products exist; nothing open qualifies."
  - category: protocol-bridges
    description: "MCP server for OSIsoft/AVEVA PI System and for the Ignition historian specifically."
    status: narrowed
    note: "v0.2 said no historian MCP existed at all. chewcw/aveva-historian-mcpserver and industrial-aiops OPC UA HA have since narrowed this to PI and Ignition."

