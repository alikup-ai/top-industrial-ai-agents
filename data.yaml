projects:
  - name: "kukapay/opcua-mcp"
    category: protocol-bridges
    url: "https://github.com/kukapay/opcua-mcp"
    open_source: true
    tags: [opc-ua, mcp]
    summary_en: "MCP server for OPC UA. Read/write node values, browse namespace. No policy layer."
    verdict_en: "Useful as starting reference, unsafe in production without guardrail wrapper."

  - name: "IndustriAgents/OPCUA-MCP"
    category: protocol-bridges
    url: "https://github.com/IndustriAgents/OPCUA-MCP"
    open_source: true
    tags: [opc-ua, mcp]
    summary_en: "Local MCP bridge for OPC UA browsing, live and historical data, subscriptions, events and alarms. Read-only by default."
    verdict_en: "Runnable in Python or Node with a mock server. Uses local stdio and one OPC UA endpoint per process. Real equipment requires a secured OPC UA channel."

  - name: "Siemens WinCC OA MCP Server"
    category: protocol-bridges
    url: "https://www.winccoa.com/"
    open_source: false
    tags: [opc-ua, mqtt, mcp, vendor]
    summary_en: "Official MCP server from Siemens for WinCC OA — datapoint read/write, OPC UA/MQTT."
    verdict_en: "First vendor-published MCP for industrial SCADA. Vendor-locked but signals mainstream adoption."

  - name: "LlamaFirewall"
    category: guardrails
    url: "https://github.com/meta-llama/PurpleLlama"
    open_source: true
    tags: [guardrails, general-purpose]
    summary_en: "Open-source framework for LLM agent guardrails. Text-level filtering."
    verdict_en: "Does not understand process semantics. General-purpose only."

  - name: "NVIDIA NeMo-Guardrails"
    category: guardrails
    url: "https://github.com/NVIDIA/NeMo-Guardrails"
    open_source: true
    tags: [guardrails, general-purpose]
    verdict_en: "Programmable runtime rails. General-purpose, no OT awareness."

  - name: "SOP-Bench (Amazon)"
    category: benchmarks
    url: "https://github.com/amazon-science/SOP-Bench"
    open_source: true
    tags: [benchmark, sop]
    verdict_en: "2000+ SOP tasks across 12 domains. Not process control."

  - name: "AssetOpsBench (IBM)"
    category: benchmarks
    url: "https://github.com/ibm/AssetOpsBench"
    open_source: true
    tags: [benchmark, maintenance]
    verdict_en: "Asset ops & maintenance benchmark with leaderboard. Not real-time process supervision."

  - name: "Tennessee Eastman Process"
    category: simulators
    url: "https://github.com/camaramm/tennessee-eastman-profBraatz"
    open_source: true
    tags: [simulator, chemical]
    verdict_en: "Classic chemical plant simulator. Natural base for control-agent benchmarks."

  - name: "Piklema"
    category: advisors
    url: "https://piklema.com/"
    open_source: false
    country: RU
    tags: [advisor, mining, pre-llm]
    verdict_en: "Real-time advisor for mineral processing. Classical ML/APC. Reference for what production advisors look like."

  - name: "Tsifra Digital Advisors"
    category: advisors
    url: "https://zyfra.com/"
    open_source: false
    country: RU
    tags: [advisor, metallurgy, pre-llm]
    verdict_en: "Metallurgy advisors. Pre-LLM generation."

  - name: "SIPO (Rosatom)"
    category: advisors
    open_source: false
    country: RU
    tags: [advisor, nuclear, closed]
    verdict_en: "NPP operator support: 360 systems, 200 procedures, 30-min forecast. No public implementation."

  - name: "AgentOps"
    category: adjacent-tools
    url: "https://github.com/AgentOps-AI/agentops"
    open_source: true
    tags: [observability, evals]
    verdict_en: "Tracing and replay for agents. Directly applicable in industrial deployments."

  - name: "DSPY"
    category: adjacent-tools
    url: "https://github.com/stanfordnlp/dspy"
    open_source: true
    tags: [prompt-optimization]
    verdict_en: "Compilable-prompt approach. Relevant for evals-heavy industrial workflows."

  - name: "E2B"
    category: adjacent-tools
    url: "https://github.com/e2b-dev/E2B"
    open_source: true
    tags: [sandbox]
    verdict_en: "Sandboxed code execution. Conceptually related to shadow-mode for OT agents."

  - name: "Cognee"
    category: adjacent-tools
    url: "https://github.com/topoteretes/cognee"
    open_source: true
    tags: [knowledge-graph]
    verdict_en: "Knowledge-graph layer. Useful for regulation/procedure grounding."

