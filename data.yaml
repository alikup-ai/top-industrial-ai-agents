    pushed: 2026-11-07
    archived: false
    tags: [guardrails, general-purpose, colang]
    verdict_en: "Five rail types, Colang policy language, plausibly extensible to industrial rules. Moved from NVIDIA/NeMo-Guardrails — v0.1 of this file had the stale path."

  - name: "alikup-ai/otgate"
    category: guardrails
    url: "https://github.com/alikup-ai/otgate"
    open_source: true
    license: Apache-2.0
    stars: 0
    pushed: 2026-11-08
    archived: false
    maintainer_own_project: true
    tags: [opc-ua, mcp, process-semantics, interlocks, rate-limit, human-approval, fail-closed, owasp-asi02]
    summary_en: "Authorization gateway between an agent and an OPC UA server, and itself an MCP server. Per-tag deny-by-default policy in process terms: value_range, max_rate over rate_interval, interlocks reading live guard tags, cumulative_range over a window against sliced moves, max_calls against call storms. Writes can require human approval on a physically separate authenticated channel, re-checked against current process state before execution. Shadow mode. Unverifiable safety conditions fail closed. 142 tests incl. live opc.tcp:// integration."
    verdict_en: "DISCLOSURE: this list's maintainer's own project, listed because v0.3 wrongly declared its niche empty. The only open implementation of the process-semantics envelope category — and alpha: zero stars, no forks, no field deployment, one author. Unmaintained July-November 2026, during which an mcp major release broke its install; that and two baseline defects in its own core checks (rate and drift measured against gateway memory rather than the live process, letting a 144-unit jump pass a 5-per-60s policy) were fixed in November. The design is the right shape for OT; the implementation has had one careful pass and no adversarial contact with a real plant."

  - name: "sint-ai/sint-protocol"
    category: guardrails
    url: "https://github.com/sint-ai/sint-protocol"
    open_source: true
    license: Apache-2.0
    stars: 15
    pushed: 2026-11-09
    archived: false
    tags: [runtime-governance, mcp, robotics]
    verdict_en: "Runtime security and governance for agents, MCP tools and robots. Adjacent rather than industrial, but framed as runtime governance rather than text filtering."

  - name: "shadowhunter-92/wafertrust — WaferTrust"
    category: guardrails
    url: "https://github.com/shadowhunter-92/wafertrust"
    open_source: true
    license: Apache-2.0
    stars: 0
    pushed: null
    archived: null
    tags: [secs-gem, mcp, governance, wafer-dollar-budget, human-approval, hash-chained-audit, fab, simulator]
    summary_en: "Python MCP-wire gateway demo for simulated semiconductor equipment and maintenance workflows. AgentBridge kernel logs reads and gates sensitive writes on human approval and sufficient budget. Fixed illustrative wafer-dollar tool costs, cumulative budget, per-call cap, hash-chained in-process audit."
    verdict_en: "DISCLOSURE: submitter's own project. Simulator-based alpha, no field deployment or live SECS/GEM connection. Tool-access governance, not a process-physics envelope. Unsigned audit entries; registered Ed25519 identity without caller-signature verification. Committed JSONL files are partial summaries, not self-contained independently verifiable logs. The agentAudit extension is simulated, not native E191. Overlaps industrial-aiops' SECS/GEM governance; useful for evaluating fab-first audit/approval workflows and illustrative wafer-dollar accounting, not production safety or SEMI compliance."

